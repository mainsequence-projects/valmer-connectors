# The CLI injects one related project image for the entire batch at scheduling time.
jobs:
  - name: valmer-vector-refresh
    execution_path: scripts/update_vector_valmer.py
    spot: false
    cpu_request: 0.50
    memory_request: 1.00
    task_schedule:
      schedule:
        type: crontab
        expression: "5 13 * * 1-5"
  - name: banxico-tiie-cete-fixings-refresh
    execution_path: scripts/update_banxico_fixings.py
    spot: false
    cpu_request: 0.50
    memory_request: 1.00
    task_schedule:
      schedule:
        type: crontab
        expression: "10 13 * * 1-5"
  - name: valmer-tiie-zero-curve-refresh
    execution_path: scripts/update_tiie_zero_curve.py
    spot: false
    cpu_request: 0.50
    memory_request: 1.00
    task_schedule:
      schedule:
        type: crontab
        expression: "15 13 * * 1-5"
  - name: banxico-policy-target-refresh
    execution_path: scripts/update_banxico_policy_rates.py
    spot: false
    cpu_request: 0.50
    memory_request: 1.00
    task_schedule:
      schedule:
        type: crontab
        expression: "20 13 * * 1-5"
  - name: fred-reference-rates-refresh
    execution_path: scripts/update_fred_reference_rates.py
    spot: false
    cpu_request: 0.50
    memory_request: 1.00
    task_schedule:
      schedule:
        type: crontab
        expression: "30 23 * * 1-5"
