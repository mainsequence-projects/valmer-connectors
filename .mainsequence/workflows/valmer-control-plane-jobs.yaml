api_version: 2.1.0
name: valmer-control-plane-jobs

resources:
  - key: vector-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh
      execution_path: scripts/update_vector_valmer.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: vector-onedrive-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh — OneDrive Graph
      execution_path: scripts/update_vector_valmer_onedrive.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: vector-metatable-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh — MetaTable
      execution_path: scripts/update_vector_valmer_metatable.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: irs-mxn-quotes-refresh
    kind: job
    spec:
      name: Valmer IRS MXN Quotes Refresh
      execution_path: scripts/update_valmer_irs_mxn_quotes.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: irs-usd-quotes-refresh
    kind: job
    spec:
      name: Valmer IRS USD Quotes Refresh
      execution_path: scripts/update_valmer_irs_usd_quotes.py
