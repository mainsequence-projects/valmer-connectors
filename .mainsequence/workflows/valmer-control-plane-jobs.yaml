  - key: tiie-curve-refresh
    kind: job
    spec:
      name: Valmer TIIE Curve Refresh
      execution_path: scripts/update_valmer_tiie_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: sofr-curve-refresh
    kind: job
    spec:
      name: Valmer SOFR Curve Refresh
