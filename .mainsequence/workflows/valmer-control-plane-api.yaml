api_version: "2.3.0"
name: valmer-control-plane-api

# The repository's only workflow file: the control-plane API, the migration
# Job that gates it, and every pipeline Job. A target's identity is this file
# path plus its resource key, so rename neither: on the next push a new path or
# key creates a new target, and the old one is not carried over.
#
# Every workload reaches the Environment's MetaTables API, so each declares
# view on the MetaTables repository's branch. Every workload that reaches
# Markets registries through the Markets API (ms-markets ADR 0047) also
# declares view on the MainSequenceMarkets branch, which lets it find that API;
# the migration Job and the read-only verification Job do not. The API also
# declares edit on every Job it launches: a workload sees and runs only the
# Jobs granted to it. Table access is not declared here; the Valmer Team
# grants it (see docs/deployment.md, "Teams And Namespaces" and "Markets API
# Access").

resources:
  - key: valmer-control-plane-api
    kind: fastapi
    spec:
      source_path: api/valmer_control_plane/main.py
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      revision_retention_count: 3
      cors_allowed_origins:
        - https://*.site-dev.main-sequence.app
      env_vars:
        - name: VALMER_CONTROL_PLANE_OPERATOR_UIDS
          value: e2a4f38a-1b5f-40a3-974f-70bc8f065b3f
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view
      # The JOB_LAUNCH_PROFILES of src/valmer_connectors/control_plane/catalog.py.
      resources:
        - key: vector-refresh
          level: edit
        - key: vector-onedrive-refresh
          level: edit
        - key: vector-metatable-refresh
          level: edit
        - key: irs-mxn-quotes-refresh
          level: edit
        - key: irs-usd-quotes-refresh
          level: edit
        - key: banxico-fixings-refresh
          level: edit
        - key: banxico-tiie-fixings-refresh
          level: edit
        - key: fred-reference-rates-refresh
          level: edit
        - key: banxico-policy-refresh
          level: edit
        - key: tiie-curve-refresh
          level: edit
        - key: sofr-curve-refresh
          level: edit
        - key: xccy-curve-refresh
          level: edit
        - key: xccy-curve-rebuild
          level: edit
        - key: government-curve-refresh
          level: edit
        - key: standard-pipeline-refresh
          level: edit
        - key: pipeline-verification
          level: edit
        - key: registry-seed
          level: edit
        - key: time-series-backfill
          level: edit

  - key: migrate-valmer
    kind: job
    spec:
      name: Valmer migrations
      description: Apply the Valmer MetaTables migrations before the control-plane API rolls out.
      execution_path: scripts/migrate_valmer.py
      cpu_request: "1"
      memory_request: "1"
      max_runtime_seconds: 1800
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view

  # Pipeline Jobs. The control-plane API launches every one of them, and
  # standard-pipeline-refresh is the only scheduled Job. No execution step
  # references them, on purpose: the backend activates a Job's new image,
  # schedule included, as soon as the commit image is verified, whatever a
  # step's needs say, and a Job in the graph would tie its promotion policy to
  # the API's group. Each one redeploys on every push by itself, so keep every
  # revision compatible with the previous release (expand first).
  - key: vector-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh
      description: Import the configured Main Sequence Artifact source and publish vector observations.
      execution_path: scripts/update_vector_valmer.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: vector-onedrive-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh — OneDrive Graph
      description: Import Valmer files from the configured Microsoft Graph drive.
      execution_path: scripts/update_vector_valmer_onedrive.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: vector-metatable-refresh
    kind: job
    spec:
      name: Valmer Vector Refresh — MetaTable
      description: Import Valmer rows from the repository-configured MetaTable source.
      execution_path: scripts/update_vector_valmer_metatable.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: irs-mxn-quotes-refresh
    kind: job
    spec:
      name: Valmer IRS MXN Quotes Refresh
      description: Publish the current IRS MXN quote snapshot.
      execution_path: scripts/update_valmer_irs_mxn_quotes.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: irs-usd-quotes-refresh
    kind: job
    spec:
      name: Valmer IRS USD Quotes Refresh
      description: Publish the current IRS USD and SOFR quote snapshot.
      execution_path: scripts/update_valmer_irs_usd_quotes.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: banxico-fixings-refresh
    kind: job
    spec:
      name: Banxico Fixings Refresh
      description: Refresh supported Banxico TIIE and CETE fixings.
      execution_path: scripts/update_banxico_fixings.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: banxico-tiie-fixings-refresh
    kind: job
    spec:
      name: Banxico TIIE Fixings Refresh
      description: Refresh only the overnight, 28-day, 91-day, and 182-day TIIE fixings.
      execution_path: scripts/update_banxico_tiie_fixings.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: fred-reference-rates-refresh
    kind: job
    spec:
      name: FRED Reference Rates Refresh
      description: Refresh configured FRED reference-rate observations.
      execution_path: scripts/update_fred_reference_rates.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: banxico-policy-refresh
    kind: job
    spec:
      name: Banxico Policy Target Refresh
      description: Refresh the Banco de Mexico policy target series.
      execution_path: scripts/update_banxico_policy_rates.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: tiie-curve-refresh
    kind: job
    spec:
      name: Valmer TIIE Curve Refresh
      description: Build the TIIE curve after MXN quotes and Banxico fixings are fresh.
      execution_path: scripts/update_valmer_tiie_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: sofr-curve-refresh
    kind: job
    spec:
      name: Valmer SOFR Curve Refresh
      description: Build the SOFR curve after USD quotes are fresh.
      execution_path: scripts/update_valmer_usd_sofr_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: xccy-curve-refresh
    kind: job
    spec:
      name: Valmer USD/MXN XCCY Curve Refresh
      description: Build the cross-currency curve after TIIE and SOFR are fresh.
      execution_path: scripts/update_valmer_usd_mxn_xccy_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: xccy-curve-rebuild
    kind: job
    spec:
      name: Valmer USD/MXN XCCY Curve Rebuild
      description: Force a rebuild of the current cross-currency curve for recovery.
      execution_path: scripts/rebuild_valmer_usd_mxn_xccy_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: government-curve-refresh
    kind: job
    spec:
      name: Valmer MXN Government Curve Refresh
      description: Build the government curve after the Valmer vector is fresh.
      execution_path: scripts/update_valmer_mxn_government_curve.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 10800
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: standard-pipeline-refresh
    kind: job
    spec:
      name: Valmer Standard Pipeline Refresh
      description: Execute the complete dependency-ordered production refresh.
      execution_path: scripts/run_control_plane_pipeline.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 21600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
      task_schedule:
        schedule:
          type: crontab
          expression: "0 13 * * 1-5"
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  - key: pipeline-verification
    kind: job
    spec:
      name: Valmer Pipeline Verification
      description: Run the persisted-data verification suite without mutating source data.
      execution_path: scripts/verify_current_pipeline.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 3600
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view

  # Writes the static Markets registry rows (Index, conventions, curves,
  # market-data bindings) that bootstrap_runtime() no longer seeds by default.
  # The standard pipeline runs it as its first stage.
  - key: registry-seed
    kind: job
    spec:
      name: Valmer Registry Seed
      description: Write the Index, convention, curve and market-data binding rows the Valmer producers reference.
      execution_path: scripts/seed_valmer_registries.py
      cpu_request: "0.5"
      memory_request: "2"
      max_runtime_seconds: 1800
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view
        - repository: MainSequenceMarkets
          level: view

  # Copies Valmer's curves, fixings and daily Index values from the core
  # Markets tables into Valmer's own tables, or back with --rollback
  # (docs/time-series-instances.md). It reads and writes tables only, so it
  # does not call the Markets API.
  - key: time-series-backfill
    kind: job
    spec:
      name: Valmer Time-Series Backfill
      description: Copy Valmer's discount curves, Banxico fixings and daily Index values from the Markets tables into Valmer's own tables, or back.
      execution_path: scripts/backfill_valmer_time_series.py
      cpu_request: "1"
      memory_request: "4"
      max_runtime_seconds: 7200
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null
    access:
      branches:
        - repository: MetaTables
          level: view

execution:
  steps:
    image:
      prepare_image: valmer-control-plane-api
    migrate:
      run_job: migrate-valmer
      image_from: image
      needs: [image]
    deploy_api:
      deploy: valmer-control-plane-api
      image_from: image
      needs: [migrate]
